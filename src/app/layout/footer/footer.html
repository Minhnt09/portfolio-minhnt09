<footer class="border-t border-white/8 px-5 py-10">
  <div class="mx-auto flex max-w-6xl flex-col gap-5 text-sm text-white/55 md:flex-row md:items-center md:justify-between">
    <div>
      <p class="font-semibold text-white">{{ profile.name }}</p>
      <p>{{ profile.badge }}</p>
    </div>
    <p>© {{ year }} Minh Nguyen. Built with Angular and Tailwind CSS.</p>
    <div class="flex gap-4">
      <a class="link-underline" [href]="profile.github" target="_blank" rel="noopener">GitHub</a>
      <a class="link-underline" [href]="profile.linkedin">LinkedIn</a>
    </div>
  </div>
</footer>
