<header class="fixed left-0 right-0 top-0 z-50 px-4 pt-4">
  <nav class="mx-auto flex max-w-6xl items-center justify-between rounded-full border border-white/10 bg-[#080808]/70 px-4 py-3 shadow-2xl shadow-black/30 backdrop-blur-2xl md:px-5">
    <a routerLink="/" class="text-sm font-semibold text-white">{{ profile.name }}</a>

    <div class="hidden items-center gap-1 rounded-full border border-white/8 bg-white/[0.03] p-1 md:flex">
      @for (item of navItems; track item.target) {
        <button
          class="nav-link"
          [class.nav-link--active]="scroll.activeSection() === item.target"
          type="button"
          (click)="navigate(item.target)"
        >
          {{ item.label }}
        </button>
      }
    </div>

    <a class="hidden rounded-full border border-white/10 px-4 py-2 text-sm text-white/82 transition hover:border-[#5e8bff]/70 hover:text-white md:block" href="https://github.com/Minhnt09" target="_blank" rel="noopener">GitHub</a>

    <button class="grid h-10 w-10 place-items-center rounded-full border border-white/10 text-white md:hidden" type="button" (click)="menuOpen.set(!menuOpen())" aria-label="Toggle menu">
      <span class="h-0.5 w-5 bg-current shadow-[0_7px_0_currentColor,0_-7px_0_currentColor]"></span>
    </button>
  </nav>

  @if (menuOpen()) {
    <div class="mx-auto mt-3 max-w-6xl rounded-[24px] border border-white/10 bg-[#080808]/92 p-3 shadow-2xl backdrop-blur-2xl md:hidden">
      @for (item of navItems; track item.target) {
        <button class="block w-full rounded-2xl px-4 py-3 text-left text-sm text-white/78" type="button" (click)="navigate(item.target)">
          {{ item.label }}
        </button>
      }
    </div>
  }
</header>
