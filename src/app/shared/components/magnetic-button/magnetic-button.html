@if (href) {
  <a
    class="magnetic-button"
    [class.magnetic-button--ghost]="variant === 'ghost'"
    [href]="href"
    target="_blank"
    rel="noopener"
  >
    <span><ng-content /></span>
  </a>
} @else {
  <button class="magnetic-button" [class.magnetic-button--ghost]="variant === 'ghost'" [type]="type" [disabled]="disabled">
    <span><ng-content /></span>
  </button>
}
