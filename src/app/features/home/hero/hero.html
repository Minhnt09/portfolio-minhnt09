<section id="home" class="hero-section relative flex min-h-dvh items-center overflow-hidden px-5 pb-20 pt-28 md:pt-24">
  <div class="hero-grid absolute inset-0"></div>
  <div class="absolute left-1/2 top-20 h-[38rem] w-[38rem] -translate-x-1/2 rounded-full bg-[#4f7cff]/18 blur-[120px]"></div>
  <div class="absolute right-10 top-24 h-2 w-2 rounded-full bg-white/30 shadow-[120px_180px_0_rgba(255,255,255,.16),-160px_260px_0_rgba(94,139,255,.22)]"></div>

  <div
    class="relative z-10 mx-auto grid w-full max-w-6xl items-center gap-14 md:grid-cols-[1.05fr_.95fr]"
    [style.transform]="'translateY(' + (-scrollProgress() * 36) + 'px) scale(' + (1 - scrollProgress() * 0.07) + ')'"
    [style.opacity]="1 - scrollProgress() * 0.18"
    [style.filter]="'blur(' + scrollProgress() * 1.2 + 'px)'"
  >
    <div class="max-w-3xl">
      <div class="hero-reveal inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/[0.04] px-4 py-2 text-xs font-semibold uppercase tracking-[0.22em] text-[#9db5ff]">
        <span class="h-2 w-2 rounded-full bg-[#5e8bff] shadow-[0_0_18px_#5e8bff]"></span>
        {{ profile.badge }}
      </div>
      <h1 class="hero-reveal mt-6 text-5xl font-semibold leading-[0.98] text-white md:text-7xl lg:text-8xl">
        {{ profile.name }}
      </h1>
      <p class="hero-reveal mt-5 max-w-2xl text-lg font-medium text-white/82 md:text-2xl">
        {{ profile.role }}
      </p>
      <p class="hero-reveal mt-6 max-w-2xl text-base leading-8 text-white/58 md:text-lg">
        {{ profile.description }}
      </p>
      <div class="hero-reveal mt-9 flex flex-col gap-3 sm:flex-row">
        <app-magnetic-button (click)="goTo('projects')">View Projects</app-magnetic-button>
        <app-magnetic-button variant="ghost" (click)="goTo('contact')">Contact Me</app-magnetic-button>
      </div>
    </div>

    <div appParallax [parallaxStrength]="22" class="interactive relative mx-auto w-full max-w-[30rem]">
      <div class="absolute inset-8 rounded-[36px] bg-[#5e8bff]/24 blur-3xl"></div>
      <div class="avatar-card relative overflow-hidden rounded-[32px] border border-white/10 bg-[#101010]/80 p-3 shadow-2xl shadow-black/50 transition duration-700 hover:scale-[1.03]">
        <video class="aspect-[4/5] w-full rounded-[24px] object-cover opacity-90" autoplay loop muted playsinline preload="metadata" src="/assets/videos/dev.mp4"></video>
        <div class="absolute inset-3 rounded-[24px] bg-gradient-to-t from-black/70 via-transparent to-white/8"></div>
        <div class="absolute bottom-7 left-7 right-7">
          <p class="text-sm uppercase tracking-[0.22em] text-white/45">Currently building</p>
          <p class="mt-2 text-2xl font-semibold text-white">Angular interfaces with motion and care.</p>
        </div>
      </div>
    </div>
  </div>
</section>
