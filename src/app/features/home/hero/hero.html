<section id="home" class="hero-section relative flex min-h-[auto] items-center overflow-hidden px-5 pb-14 pt-24 md:min-h-dvh md:pb-20 md:pt-24">
  <div class="hero-grid absolute inset-0"></div>
  <div class="absolute left-1/2 top-16 h-[22rem] w-[22rem] max-w-[calc(100vw-2.5rem)] -translate-x-1/2 rounded-full bg-[#4f7cff]/18 blur-[90px] md:top-20 md:h-[38rem] md:w-[38rem] md:blur-[120px]"></div>
  <div class="absolute right-10 top-24 h-2 w-2 rounded-full bg-white/30 shadow-[120px_180px_0_rgba(255,255,255,.16),-160px_260px_0_rgba(94,139,255,.22)]"></div>

  <div
    class="relative z-10 mx-auto grid w-full max-w-6xl grid-cols-1 items-center gap-9 md:grid-cols-[1.05fr_.95fr] md:gap-14"
    [style.transform]="'translateY(' + (-scrollProgress() * 36) + 'px)'"
    [style.opacity]="1 - scrollProgress() * 0.18"
    [style.filter]="'blur(' + scrollProgress() * 1.2 + 'px)'"
  >
    <div class="max-w-3xl">
      <div class="hero-reveal inline-flex max-w-full items-center gap-2 rounded-full border border-white/10 bg-white/[0.04] px-4 py-2 text-xs font-semibold uppercase tracking-[0.16em] text-[#9db5ff] md:tracking-[0.22em]">
        <span class="h-2 w-2 rounded-full bg-[#5e8bff] shadow-[0_0_18px_#5e8bff]"></span>
        {{ profile.badge }}
      </div>
      <h1 class="hero-reveal mt-5 text-[2.75rem] font-semibold leading-[1.02] text-white min-[390px]:text-5xl md:mt-6 md:text-7xl lg:text-8xl">
        {{ profile.name }}
      </h1>
      <p class="hero-reveal mt-5 max-w-2xl text-base font-medium leading-7 text-white/82 md:text-2xl md:leading-normal">
        {{ profile.role }}
      </p>
      <p class="hero-reveal mt-5 max-w-2xl text-[15px] leading-7 text-white/62 md:mt-6 md:text-lg md:leading-8">
        {{ profile.description }}
      </p>
      <div class="hero-reveal mt-7 flex flex-col gap-3 min-[430px]:flex-row min-[430px]:flex-wrap md:mt-9">
        <app-magnetic-button variant="cv" href="/assets/cv/CV_NguyenThienMinh_Frontend.pdf" download="CV_NguyenThienMinh_Frontend.pdf">
          <span class="cv-button-label">T&#7843;i CV</span>
          <svg class="cv-download-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M5 19h14" />
          </svg>
        </app-magnetic-button>
        <app-magnetic-button variant="ghost" (click)="goTo('contact')">Contact Me</app-magnetic-button>
      </div>
    </div>

    <div appParallax [parallaxStrength]="22" class="interactive relative mx-auto w-full max-w-[26rem] md:max-w-[30rem]">
      <div class="absolute inset-6 rounded-[28px] bg-[#5e8bff]/20 blur-2xl md:inset-8 md:rounded-[36px] md:bg-[#5e8bff]/24 md:blur-3xl"></div>
      <div class="avatar-card relative overflow-hidden rounded-[24px] border border-white/10 bg-[#101010]/80 p-2.5 shadow-2xl shadow-black/50 transition duration-700 hover:scale-[1.03] md:rounded-[32px] md:p-3">
        <!-- <video class="aspect-[4/5] w-full rounded-[24px] object-cover opacity-90" autoplay loop muted playsinline preload="metadata" src="/assets/videos/dev.mp4"></video> -->
        <img
          class="aspect-[4/5] w-full rounded-[18px] object-cover opacity-90 md:rounded-[24px]"
          src="/assets/images/avatar/avatar-cv.png"
          alt="Minh Nguyen"
        />
        <div class="absolute inset-2.5 rounded-[18px] bg-gradient-to-t from-black/70 via-transparent to-white/8 md:inset-3 md:rounded-[24px]"></div>
        <div class="absolute bottom-5 left-5 right-5 md:bottom-7 md:left-7 md:right-7">
          <p class="text-xs uppercase tracking-[0.18em] text-white/45 md:text-sm md:tracking-[0.22em]">Currently building</p>
          <p class="mt-2 text-xl font-semibold leading-tight text-white md:text-2xl">Angular interfaces with motion and care.</p>
        </div>
      </div>
    </div>
  </div>
</section>
