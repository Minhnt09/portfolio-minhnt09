<section id="about" class="section-pad px-5">
  <app-section-title eyebrow="About Me" title="Focused on clean interfaces and real-world growth." [description]="profile.goal" />

  <div appRevealOnScroll class="mx-auto max-w-6xl">
    <app-glass-card>
      <div class="grid gap-8 p-6 md:grid-cols-[.9fr_1.1fr] md:p-10">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.22em] text-[#79a0ff]">Profile</p>
          <h3 class="mt-4 text-3xl font-semibold text-white md:text-5xl">Frontend Developer in progress.</h3>
        </div>
        <p class="text-base leading-8 text-white/64 md:text-lg">{{ profile.description }}</p>
      </div>
      <div class="grid gap-3 border-t border-white/8 p-4 sm:grid-cols-2 lg:grid-cols-5">
        @for (fact of facts; track fact[0]; let i = $index) {
          <div appRevealOnScroll [revealDelay]="i * 70" class="rounded-[22px] border border-white/8 bg-white/[0.035] p-5 transition duration-500 hover:-translate-y-1 hover:border-[#5e8bff]/45">
            <p class="text-xs uppercase tracking-[0.18em] text-white/38">{{ fact[0] }}</p>
            <p class="mt-3 text-sm font-medium leading-6 text-white/86">{{ fact[1] }}</p>
          </div>
        }
      </div>
    </app-glass-card>
  </div>
</section>
