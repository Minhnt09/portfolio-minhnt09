<section id="contact" class="section-pad px-5">
  <app-section-title eyebrow="Contact" title="Let's build something great together." description="Open to frontend opportunities, Angular projects, and thoughtful product interfaces." />

  <div appRevealOnScroll class="mx-auto grid max-w-6xl gap-6 rounded-[32px] border border-white/10 bg-white/[0.04] p-5 shadow-2xl shadow-black/30 backdrop-blur-2xl md:grid-cols-[.85fr_1.15fr] md:p-8">
    <div class="rounded-[26px] border border-white/8 bg-[#0b0b0b]/80 p-6">
      <h3 class="text-2xl font-semibold text-white">{{ profile.name }}</h3>
      <p class="mt-3 text-sm leading-7 text-white/58">{{ profile.role }}</p>
      <div class="mt-8 grid gap-3 text-sm">
        <a class="footer-link-row" [href]="'mailto:' + profile.email">
          <span class="footer-link-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6.5h16v11H4v-11Zm1.7 1.4 6.3 5 6.3-5H5.7Zm12.8 8.2V9.8l-6.5 5.1-6.5-5.1v6.3h13Z" />
            </svg>
          </span>
          <span class="min-w-0">
            <span class="block text-xs uppercase tracking-[0.16em] text-white/34">Email</span>
            <span class="block break-all text-white/72">{{ profile.email }}</span>
          </span>
        </a>

        <a class="footer-link-row" [href]="'tel:' + profile.phone">
          <span class="footer-link-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7.2 4.5 9.8 4l1.4 5-1.7.8c.8 1.7 2.1 3 3.8 3.8l.8-1.7 5 1.4-.5 2.6c-.2 1.1-1.1 1.9-2.2 1.9C9.7 17.8 4.2 12.3 4.2 5.6c0-1.1.8-2 2-2.2Z" />
            </svg>
          </span>
          <span>
            <span class="block text-xs uppercase tracking-[0.16em] text-white/34">Phone</span>
            <span class="block text-white/72">{{ profile.phone }}</span>
          </span>
        </a>

        <a class="footer-link-row" [href]="profile.github" target="_blank" rel="noopener">
          <span class="footer-link-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.4a8.6 8.6 0 0 0-2.7 16.8c.4.1.6-.2.6-.4v-1.5c-2.4.5-2.9-1-2.9-1-.4-.9-.9-1.2-.9-1.2-.8-.5.1-.5.1-.5.9.1 1.4.9 1.4.9.8 1.3 2 1 2.4.8.1-.6.3-1 .6-1.2-1.9-.2-3.9-1-3.9-4.2 0-.9.3-1.7.9-2.3-.1-.2-.4-1.1.1-2.3 0 0 .7-.2 2.4.9.7-.2 1.4-.3 2.1-.3s1.4.1 2.1.3c1.6-1.1 2.4-.9 2.4-.9.5 1.2.2 2.1.1 2.3.5.6.9 1.4.9 2.3 0 3.3-2 4-3.9 4.2.3.3.6.8.6 1.7v2.4c0 .3.2.5.6.4A8.6 8.6 0 0 0 12 3.4Z" />
            </svg>
          </span>
          <span>
            <span class="block text-xs uppercase tracking-[0.16em] text-white/34">GitHub</span>
            <span class="block text-white/72">github.com/Minhnt09</span>
          </span>
        </a>

        <a class="footer-link-row" [href]="profile.linkedin">
          <span class="footer-link-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5.2 8.7h3.2v10.1H5.2V8.7Zm1.6-4.8a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6Zm4.1 4.8H14V10c.5-.8 1.4-1.6 3-1.6 2.2 0 3.8 1.4 3.8 4.5v5.9h-3.2v-5.5c0-1.4-.5-2.2-1.7-2.2-1 0-1.5.6-1.8 1.2-.1.2-.1.5-.1.8v5.7h-3.2V8.7Z" />
            </svg>
          </span>
          <span>
            <span class="block text-xs uppercase tracking-[0.16em] text-white/34">LinkedIn</span>
            <span class="block text-white/72">Profile link</span>
          </span>
        </a>
      </div>
    </div>

    <form class="grid gap-4" #contactForm="ngForm" (ngSubmit)="contactForm.valid && sendMessage()">
      <input class="field" name="name" [(ngModel)]="form.name" placeholder="Name" required [disabled]="isSending" />
      <input class="field" name="email" [(ngModel)]="form.email" placeholder="Email" type="email" required [disabled]="isSending" />
      <textarea class="field min-h-36 resize-none" name="message" [(ngModel)]="form.message" placeholder="Message" required [disabled]="isSending"></textarea>
      <app-magnetic-button type="submit" [disabled]="isSending || contactForm.invalid === true">
        {{ isSending ? 'Sending...' : 'Send Message' }}
      </app-magnetic-button>
      @if (statusMessage) {
        <p class="text-sm" [class.text-[#8bb0ff]]="status === 'success'" [class.text-red-300]="status === 'error'">
          {{ statusMessage }}
        </p>
      }
    </form>
  </div>
</section>
