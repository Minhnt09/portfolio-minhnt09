<section class="min-h-dvh px-5 pb-20 pt-32">
  <div class="mx-auto max-w-6xl">
    <a routerLink="/" class="link-underline text-sm text-white/60">Back to home</a>

    <div appRevealOnScroll class="mt-10 grid gap-8 md:grid-cols-[1fr_.85fr]">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.22em] text-[#79a0ff]">{{ project().eyebrow }}</p>
        <h1 class="mt-4 text-4xl font-semibold leading-tight text-white md:text-7xl">{{ project().name }}</h1>
        <p class="mt-6 max-w-3xl text-lg leading-8 text-white/62">{{ project().longDescription }}</p>
        <div class="mt-8 flex flex-wrap gap-2">
          @for (highlight of project().highlights; track highlight) {
            <span class="rounded-full border border-white/10 bg-white/[0.04] px-3 py-1 text-sm text-white/70">{{ highlight }}</span>
          }
        </div>
        <div class="mt-9 flex flex-col gap-3 sm:flex-row">
          <app-magnetic-button [href]="project().links.github" variant="ghost">GitHub</app-magnetic-button>
          <app-magnetic-button [href]="project().links.demo">Live Demo</app-magnetic-button>
        </div>
      </div>

      <div class="overflow-hidden rounded-[32px] border border-white/10 bg-[#101010] shadow-2xl shadow-black/40">
        <video class="aspect-[4/5] h-full w-full object-cover opacity-80" autoplay loop muted playsinline preload="metadata" [src]="project().image"></video>
      </div>
    </div>
  </div>
</section>
